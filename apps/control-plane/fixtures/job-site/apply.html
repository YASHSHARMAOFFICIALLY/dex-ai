<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Apply</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <nav>
    <a href="index.html" data-testid="nav-home">Home</a>
    <a href="search.html" data-testid="nav-search">Search jobs</a>
  </nav>
  <main>
    <h1>Apply: Software Engineer</h1>
    <form method="post" action="/fixtures/job/applications" data-testid="apply-form">
      <label for="full_name">Full name</label>
      <input id="full_name" name="full_name" type="text" required data-testid="field-full-name">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" required data-testid="field-email">
      <label for="phone">Phone</label>
      <input id="phone" name="phone" type="tel" data-testid="field-phone">
      <label for="years_experience">Years of experience</label>
      <input id="years_experience" name="years_experience" type="number" min="0"
        data-testid="field-years-experience">
      <label for="work_authorization">Work authorization</label>
      <select id="work_authorization" name="work_authorization" data-testid="field-work-authorization">
        <option value="">Select</option>
        <option value="citizen">Citizen</option>
        <option value="visa">Visa holder</option>
      </select>
      <label for="cover_letter">Cover letter</label>
      <textarea id="cover_letter" name="cover_letter" rows="6" data-testid="field-cover-letter"></textarea>
      <button type="submit" data-testid="submit-application">Submit application</button>
    </form>
  </main>
</body>
</html>
